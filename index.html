<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Monitor</title>
<style>
:root{--bg:#fafaf9;--surface:#fff;--text:#18181b;--muted:#71717a;--border:#e4e4e7;--accent:#18181b;--accent-fg:#fafaf9;--ok:#16a34a}
[data-theme=dark]{--bg:#09090b;--surface:#141416;--text:#f4f4f5;--muted:#a1a1aa;--border:#27272a;--accent:#f4f4f5;--accent-fg:#09090b;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;transition:background .2s,color .2s}
header{border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .2s}
.dot.live{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
main{max-width:1080px;margin:0 auto;padding:32px 24px}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.card .val{font-size:1.1rem;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:1rem;font-weight:600;margin:0}
.panel-head .hint{font-size:.82rem;color:var(--muted);margin:2px 0 0}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;transition:opacity .15s,border-color .15s}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary:hover{opacity:.85}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:11px 20px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:500;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem}
.empty{text-align:center;color:var(--muted);padding:32px 20px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:500;background:rgba(34,197,94,.12);color:var(--ok)}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:24px}
@media(max-width:600px){th,td{padding:10px 14px}main{padding:24px 16px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
    </svg>
    Network Monitor
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <span style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)">
      <span id="dot" class="dot"></span><span id="status">Menghubungkan…</span>
    </span>
    <button id="theme" type="button">Dark</button>
  </div>
</header>

<main>
  <h1>Perangkat aktif di jaringan</h1>
  <p class="sub">Semua perangkat yang terhubung ke subnet yang sama dengan laptop ini.</p>

  <section class="cards">
    <div class="card"><p class="lbl">IP Lokal</p><p class="val" id="local-ip">—</p></div>
    <div class="card"><p class="lbl">IP Publik</p><p class="val" id="public-ip">—</p></div>
    <div class="card"><p class="lbl">Subnet</p><p class="val" id="subnet">—</p></div>
    <div class="card"><p class="lbl">Perangkat Aktif</p><p class="val" id="count">0</p></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>Daftar perangkat</h2>
        <p class="hint" id="hint">Belum ada pemindaian.</p>
      </div>
      <button class="primary" id="scan" type="button">Scan Now</button>
    </div>
    <table>
      <thead><tr><th>IP</th><th>MAC</th><th>Hostname</th><th>Status</th></tr></thead>
      <tbody id="devices">
        <tr><td colspan="4" class="empty">Memuat…</td></tr>
      </tbody>
    </table>
  </section>

  <footer>Pemindaian otomatis setiap <span id="interval">30</span> detik.</footer>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => ts ? new Date(ts * 1000).toLocaleTimeString('id-ID') : '—';

const themeBtn = $('#theme');
function setTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
  themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme(localStorage.getItem('theme') || 'light');

function renderDevices(devs){
  const tb = $('#devices');
  if (!devs.length){
    tb.innerHTML = '<tr><td colspan="4" class="empty">Belum ada perangkat terdeteksi.</td></tr>';
  } else {
    tb.innerHTML = devs.map(d => `
      <tr>
        <td class="mono">${esc(d.ip)}</td>
        <td class="mono">${esc(d.mac || '—')}</td>
        <td>${esc(d.hostname || '—')}</td>
        <td><span class="badge">aktif</span></td>
      </tr>`).join('');
  }
  $('#count').textContent = devs.length;
}

let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $('#dot').classList.add('live'); $('#status').textContent = 'Live'; };
  ws.onclose = () => { $('#dot').classList.remove('live'); $('#status').textContent = 'Terputus'; setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'init' || m.type === 'scan'){
      if (m.devices) renderDevices(m.devices);
      if (m.subnet) $('#subnet').textContent = m.subnet;
      if (m.scanned_at) $('#hint').textContent = 'Terakhir: ' + fmt(m.scanned_at);
      $('#scan').disabled = false;
    }
    if (m.type === 'scan_started'){ $('#scan').disabled = true; $('#hint').textContent = 'Memindai…'; }
    if (m.type === 'error'){ $('#hint').textContent = m.error; $('#scan').disabled = false; }
  };
}
connect();

async function poll(){
  try {
    const s = await (await fetch('/api/status')).json();
    $('#local-ip').textContent  = s.local_ip  || '—';
    $('#public-ip').textContent = s.public_ip || '—';
    if (s.subnet) $('#subnet').textContent = s.subnet;
    if (!s.scanning) $('#scan').disabled = false;
  } catch(e){}
}
setInterval(poll, 5000);
poll();

$('#scan').onclick = async () => {
  $('#scan').disabled = true;
  $('#hint').textContent = 'Memindai…';
  try { await fetch('/api/scan', { method: 'POST' }); }
  catch(e){ $('#scan').disabled = false; }
};
</script>
</body>
</html>
